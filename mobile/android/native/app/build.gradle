plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'dz.esh.footballclub.field'
    compileSdk 36

    defaultConfig {
        applicationId 'dz.esh.footballclub.field'
        minSdk 24
        targetSdk 35
        versionCode 47
        versionName '3.9.0'
    }

    buildFeatures { compose true }
    composeOptions { }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    signingConfigs {
        release {
            def signingFile = System.getenv('ESH_SIGNING_PROPERTIES')
            if (signingFile != null && file(signingFile).exists()) {
                def props = new Properties()
                file(signingFile).withInputStream { props.load(it) }
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('ESH_SIGNING_PROPERTIES') != null) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.01.00')
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation platform('com.google.firebase:firebase-bom:33.8.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'com.airbnb.android:lottie-compose:6.7.1'
}

name: Quality checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/football_club?schema=public
      AUTH_SECRET: ci-only-placeholder-secret-do-not-use-in-production
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Generate MySQL Prisma Client for type checking
        run: npm run db:mysql:generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Check translations
        run: npm run i18n:check
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Run unit and security regression suites
        run: npm run test:all
      - name: Audit production dependencies (critical/high gate)
        run: npm run test:security:audit
      - name: Build and prepare cPanel production bundle
        run: npm run build:cpanel
      - name: Package cPanel runtime
        if: github.event_name != 'pull_request'
        run: npm run package:cpanel
      - name: Upload cPanel runtime artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: esh-cpanel-${{ github.sha }}
          path: release/cpanel
          if-no-files-found: error
          retention-days: 30

  cloudflare-build:
    name: Cloudflare build (OpenNext)
    # The production target is Cloudflare Workers, but no workflow ever built
    # for it: a Next/OpenNext upgrade could break the deployed runtime while
    # every other check stayed green.
    #
    # ADVISORY for now: the OpenNext pipeline cannot be reproduced locally yet
    # (the Windows build host fails while copying pnpm symlinks, so the failure
    # cannot be attributed to a code change). The job still runs and reports,
    # but it must not hide a real regression in the static-checks job — flip
    # continue-on-error to false once a Cloudflare deploy has been verified
    # end to end with real credentials.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/football_club?schema=public
      AUTH_SECRET: ci-only-placeholder-secret-do-not-use-in-production
      NEXT_PUBLIC_PUBLIC_SITE_URL: https://example.invalid
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build for Cloudflare Workers
        run: npm run build:cloudflare

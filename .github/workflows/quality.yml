name: Quality checks

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/football_club?schema=public
      AUTH_SECRET: ci-only-placeholder-secret-do-not-use-in-production
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Check translations
        run: npm run i18n:check
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Run unit and security regression suites
        run: npm run test:all
      - name: Audit all dependencies
        run: npm audit --audit-level=moderate
      - name: Build and prepare cPanel production bundle
        run: npm run build:cpanel
      - name: Package cPanel runtime
        if: github.event_name != 'pull_request'
        run: npm run package:cpanel
      - name: Upload cPanel runtime artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: esh-cpanel-${{ github.sha }}
          path: release/cpanel
          if-no-files-found: error
          retention-days: 30
